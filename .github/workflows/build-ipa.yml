name: Build unsigned iOS IPA

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner
        type: choice
        default: macos-15-intel
        options:
          - macos-15
          - macos-15-intel

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Add verified simplified Chinese font resources
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          revision = 'f8d157532fbfaeda587e826d4cd5b21a49186f7c'
          fonts = {
              'NotoSansSC-Regular.otf': 'fc0fda9394367c16c1af7555a2ae4d5e2e6a6f02',
              'NotoSansSC-Bold.otf': 'bcc11bc30e65b69b9e5a508c3e2138197c5543cf',
          }
          for name, expected in fonts.items():
              url = f'https://raw.githubusercontent.com/notofonts/noto-cjk/{revision}/Sans/SubsetOTF/SC/{name}'
              with urllib.request.urlopen(url, timeout=90) as response:
                  data = response.read()
              actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              assert actual == expected, (name, actual)
              pathlib.Path('fonts', name).write_bytes(data)
              print('Verified font', name, len(data))
          pathlib.Path('fonts/NotoSansSC-source.txt').write_text(
              'Noto Sans CJK region-specific SC subset, SIL Open Font License 1.1.\n'
              f'https://github.com/notofonts/noto-cjk/tree/{revision}/Sans/SubsetOTF/SC\n'
              'See LICENSE.noto in this directory.\n')
          PY
      - name: Select Xcode 26 or newer
        run: |
          python3 - <<'PY'
          import glob, plistlib, re, subprocess
          candidates = []
          for app in glob.glob('/Applications/Xcode*.app'):
              with open(app + '/Contents/Info.plist', 'rb') as f:
                  version = plistlib.load(f)['CFBundleShortVersionString']
              numbers = tuple(int(n) for n in re.findall(r'\d+', version))
              if numbers[0] >= 26:
                  candidates.append((numbers, app))
          if not candidates:
              raise SystemExit('This runner needs Xcode 26+ for glassEffect and ButtonRole.confirm')
          app = max(candidates)[1]
          print('Selecting', app, flush=True)
          subprocess.run(['sudo', 'xcode-select', '--switch', app + '/Contents/Developer'], check=True)
          PY
      - name: Check native controller mapper
        run: |
          set -o pipefail
          swiftc -typecheck -swift-version 5 -target arm64-apple-ios16.0 \
            -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" \
            iphone/iDared32bit/ControllerMapping.swift iphone/iDared32bit/ControllerSwipe.swift 2>&1 | tee -a build.log
          swiftc iphone/iDared32bit/ControllerSwipe.swift dev-tests/controller_swipe_legacy.swift dev-tests/controller_swipe_tests.swift -o /tmp/controller-swipe-tests
          /tmp/controller-swipe-tests /tmp/controller-contact-trace.tsv
      - name: Install Rust iOS target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios
          xcodebuild -version
          cmake --version
      - name: Check controller touch delivery
        run: |
          rustc --edition=2021 --test src/controller_mapping.rs -o /tmp/controller-delivery-tests
          /tmp/controller-delivery-tests
          rustc --edition=2021 dev-tests/controller_delivery_trace.rs -o /tmp/controller-delivery-trace
          /tmp/controller-delivery-trace /tmp/controller-contact-trace.tsv
      - name: Build Rust emulator core
        run: |
          set -o pipefail
          export SDKROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          export IPHONEOS_DEPLOYMENT_TARGET=16.0
          cargo build --locked --release --lib --target aarch64-apple-ios 2>&1 | tee build.log
          mkdir -p build/DerivedData/Build/Products/Release-iphoneos
          cp target/aarch64-apple-ios/release/libtouchHLE.a \
            build/DerivedData/Build/Products/Release-iphoneos/libiDared32bit_static.a
      - name: Test audio buffering
        run: |
          cargo test --locked --lib audio::openal::tests
          cargo test --locked --lib audio_unit_format_tests
          cargo test --locked --lib framebuffer_export_tests
          cargo test --locked --lib cjk_font_tests
          cargo test --locked --lib controller_mapping_tests
      - name: Build device app without signing
        run: |
          set -o pipefail
          xcodebuild build \
            -project iphone/iDared32bit.xcodeproj \
            -scheme 'iDared 32bit' \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build/DerivedData" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' \
            PRODUCT_BUNDLE_IDENTIFIER=com.bixinwei.idared32bit \
            CURRENT_PROJECT_VERSION=15 \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            2>&1 | tee -a build.log
      - name: Package and verify IPA
        run: |
          set -euo pipefail
          app='build/DerivedData/Build/Products/Release-iphoneos/iDared 32bit.app'
          test -d "$app"
          test -s "$app/Fonts/NotoSansSC-Regular.otf"
          test -s "$app/Fonts/NotoSansSC-Bold.otf"
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")
          test -s "$app/$executable"
          lipo "$app/$executable" -verify_arch arm64
          mkdir -p build/package/Payload
          cp -a "$app" build/package/Payload/
          cd build/package
          zip -qry ../iDared32bit-unsigned.ipa Payload
          unzip -t ../iDared32bit-unsigned.ipa
          shasum -a 256 ../iDared32bit-unsigned.ipa > ../iDared32bit-unsigned.ipa.sha256
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iDared32bit-unsigned-IPA
          path: |
            build/iDared32bit-unsigned.ipa
            build/iDared32bit-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
